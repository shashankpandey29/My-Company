<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <!-- Dark Black Carbon Badge Gradient -->
    <linearGradient id="fullBadgeDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04070D" />
      <stop offset="50%" stop-color="#0B131E" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <!-- Vibrant Emerald / Neon Green Gradient -->
    <linearGradient id="fullNeonEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Bright Mint Glow Highlight -->
    <linearGradient id="fullMintHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="50%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Glow Filter for Starburst -->
    <filter id="fullStarGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Left Emblem Group (100x100 within 120 height) -->
  <g transform="translate(10, 10)">
    <!-- Premium Rounded Black Badge Container -->
    <rect x="0" y="0" width="100" height="100" rx="24" fill="url(#fullBadgeDark)" stroke="#10B981" stroke-width="2.5" />
    
    <!-- Subtle Internal Neon Accent Border -->
    <rect x="5" y="5" width="90" height="90" rx="19" fill="none" stroke="#34D399" stroke-width="0.8" stroke-opacity="0.35" />

    <!-- Upper Dynamic Curved Arc / Wing -->
    <path d="M50 16 C50 16 75 30 75 46 C75 56 66 63 53 63 C40 63 32 54 39 45 C43 41 49 39 53 39 C62 39 64 45 60 49 C55 54 48 52 46 49" 
          fill="none" 
          stroke="url(#fullNeonEmerald)" 
          stroke-width="5" 
          stroke-linecap="round" />

    <!-- Lower Dynamic Counter Curved Arc / Wing -->
    <path d="M50 84 C50 84 25 70 25 54 C25 44 34 37 47 37 C60 37 68 46 61 55 C57 59 51 61 47 61 C38 61 36 55 40 51 C45 46 52 48 54 51" 
          fill="none" 
          stroke="url(#fullNeonEmerald)" 
          stroke-width="5" 
          stroke-linecap="round" />

    <!-- Center Nova Starburst / Core Diamond Spark -->
    <polygon points="50,26 53,43 70,50 53,57 50,74 47,57 30,50 47,43" 
             fill="url(#fullMintHighlight)" 
             filter="url(#fullStarGlow)" 
             opacity="0.95" />

    <!-- Center Core Pulsing Dot -->
    <circle cx="50" cy="50" r="4" fill="#FFFFFF" />
    <circle cx="50" cy="50" r="6.5" fill="none" stroke="#34D399" stroke-width="1.2" stroke-opacity="0.75" />

    <!-- Tech Corner Accent Pips -->
    <circle cx="18" cy="18" r="2.2" fill="#10B981" opacity="0.8" />
    <circle cx="82" cy="82" r="2.2" fill="#10B981" opacity="0.8" />
  </g>

  <!-- Typography Group -->
  <g transform="translate(132, 0)">
    <!-- Brand Primary Wordmark -->
    <text x="0" y="62" font-family="'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="38" font-weight="900" letter-spacing="1.5" fill="#FFFFFF">
      SUPER<tspan fill="#10B981">NOVA</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="2" y="86" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" letter-spacing="3.5" fill="#34D399">
      PVT. LTD. • IT SOLUTIONS
    </text>

    <!-- Neon underline accent with soft glow gradient -->
    <line x1="2" y1="96" x2="260" y2="96" stroke="url(#fullNeonEmerald)" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
    <circle cx="260" cy="96" r="2.5" fill="#34D399" />
  </g>
</svg>
