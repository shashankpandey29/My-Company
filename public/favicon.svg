<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Dark Black Carbon Badge Gradient -->
    <linearGradient id="badgeDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04070D" />
      <stop offset="50%" stop-color="#0B131E" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <!-- Vibrant Emerald / Neon Green Gradient -->
    <linearGradient id="neonEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Bright Mint Glow Highlight -->
    <linearGradient id="mintHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="50%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Glow Filter for Starburst -->
    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Premium Rounded Black Badge Container -->
  <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#badgeDark)" stroke="#10B981" stroke-width="2.5" />
  
  <!-- Subtle Internal Neon Accent Border -->
  <rect x="11" y="11" width="98" height="98" rx="21" fill="none" stroke="#34D399" stroke-width="0.8" stroke-opacity="0.35" />

  <!-- Upper Dynamic Curved Arc / Wing (Clockwise Supernova Swoosh) -->
  <path d="M60 20 C60 20 86 36 86 54 C86 66 76 74 62 74 C48 74 38 64 46 54 C50 49 57 47 62 47 C72 47 74 54 70 59 C65 64 57 62 55 58" 
        fill="none" 
        stroke="url(#neonEmerald)" 
        stroke-width="5.5" 
        stroke-linecap="round" />

  <!-- Lower Dynamic Counter Curved Arc / Wing (Completes the S / Nova Vortex) -->
  <path d="M60 100 C60 100 34 84 34 66 C34 54 44 46 58 46 C72 46 82 56 74 66 C70 71 63 73 58 73 C48 73 46 66 50 61 C55 56 63 58 65 62" 
        fill="none" 
        stroke="url(#neonEmerald)" 
        stroke-width="5.5" 
        stroke-linecap="round" />

  <!-- Center Nova Starburst / Core Diamond Spark -->
  <polygon points="60,32 64,52 84,60 64,68 60,88 56,68 36,60 56,52" 
           fill="url(#mintHighlight)" 
           filter="url(#starGlow)" 
           opacity="0.95" />

  <!-- Center Core Pulsing Dot -->
  <circle cx="60" cy="60" r="4.5" fill="#FFFFFF" />
  <circle cx="60" cy="60" r="7" fill="none" stroke="#34D399" stroke-width="1.5" stroke-opacity="0.75" />

  <!-- Diagonal Corner Tech Accent Pips -->
  <circle cx="24" cy="24" r="2.5" fill="#10B981" opacity="0.8" />
  <circle cx="96" cy="96" r="2.5" fill="#10B981" opacity="0.8" />
</svg>
